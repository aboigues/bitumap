# Qualité et tests du code applicatif (constitution, principe VII ; plan 002).
# Contrôle requis sur main : « tests » (à ajouter au ruleset par le mainteneur).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    services:
      db:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: bitumap
          POSTGRES_PASSWORD: bitumap-ci
          POSTGRES_DB: bitumap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bitumap"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      BITUMAP_DB_URL_TEST: postgresql://bitumap:bitumap-ci@127.0.0.1:5432/bitumap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Installation de uv (version figée)
        run: python -m pip install --disable-pip-version-check "uv==0.12.19"
      - name: Dépendances (verrouillées)
        run: uv sync --frozen
      - name: Lint et format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest -v
