# Qualité et tests du code applicatif (constitution, principe VII ; plan 002).
# Contrôle requis sur main : « tests » (à ajouter au ruleset par le mainteneur).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les conteneurs de service démarrent avant toute étape : la présence du secret est vérifiée
  # dans un job préalable, avec un message clair (LL-020).
  secret-base-de-test:
    name: secret-base-de-test
    runs-on: ubuntu-26.04
    environment: ci-tests
    permissions: {}
    steps:
      - name: Présence de CI_POSTGRES_PASSWORD
        env:
          CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          if [ -z "$CI_POSTGRES_PASSWORD" ]; then
            echo "::error title=Secret absent::CI_POSTGRES_PASSWORD est vide. Les exécutions déclenchées par Dependabot ne lisent que les secrets Dependabot (Settings → Secrets and variables → Dependabot) ; les autres le lisent dans l'environnement ci-tests (LL-020)."
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Installation de uv (version figée)
        run: python -m pip install --disable-pip-version-check "uv==0.12.19"
      - name: Dépendances (verrouillées)
        run: uv sync --frozen
      - name: Lint et format
        run: |
          uv run ruff check .
          uv run ruff format --check .

  # Tests répartis en groupes parallèles, chacun avec sa base (durées mesurées en local :
  # 4 à 5 min par groupe, contre 16 min d'un bloc). « autres » est défini par exclusion :
  # un nouveau dossier de tests y est lancé sans modifier ce fichier.
  groupe:
    name: groupe (${{ matrix.groupe }})
    needs: secret-base-de-test
    runs-on: ubuntu-26.04
    # Secret CI_POSTGRES_PASSWORD rangé dans l'environnement « ci-tests » : accessible aux
    # seuls jobs qui le déclarent (zizmor : secrets-outside-env ; revue de la PR #14).
    # Exécutions déclenchées par Dependabot : même nom dans les secrets Dependabot (LL-020).
    environment: ci-tests
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - groupe: api
            chemins: tests/api
          - groupe: non-regression
            chemins: tests/non_regression
          - groupe: unit
            chemins: tests/unit
          - groupe: autres
            chemins: tests --ignore=tests/api --ignore=tests/non_regression --ignore=tests/unit
    services:
      db:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: bitumap
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: bitumap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bitumap"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Installation de uv (version figée)
        run: python -m pip install --disable-pip-version-check "uv==0.12.19"
      - name: Dépendances (verrouillées)
        run: uv sync --frozen
      - name: Tests
        env:
          # Mot de passe de la base de test : secret GitHub (revue de la PR #14).
          CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          CHEMINS: ${{ matrix.chemins }}
        run: |
          export BITUMAP_DB_URL_TEST="postgresql://bitumap:${CI_POSTGRES_PASSWORD}@127.0.0.1:5432/bitumap"
          # shellcheck disable=SC2086  # CHEMINS : plusieurs arguments, valeur de la matrice
          uv run pytest -v $CHEMINS

  # Contrôle requis sur main : « tests ». Agrège le lint et tous les groupes ; échoue si l'un
  # d'eux a échoué, a été annulé ou n'a pas tourné (un job sauté ne doit jamais valoir succès).
  tests:
    name: tests
    needs: [lint, groupe]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Résultat des jobs de test
        env:
          LINT: ${{ needs.lint.result }}
          GROUPES: ${{ needs.groupe.result }}
        run: |
          echo "lint : $LINT ; groupes : $GROUPES"
          [ "$LINT" = success ] && [ "$GROUPES" = success ]
