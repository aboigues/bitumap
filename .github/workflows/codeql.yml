# Analyse statique du code (spec FR-001, research R2).
# Le blocage des alertes passe par la règle « code scanning » du ruleset de main
# (contracts/required-checks.md) ; ce job n'échoue que si l'analyse elle-même échoue.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      actions: read            # requis par CodeQL pour lire le contexte du workflow
      contents: read
      security-events: write  # publication des résultats SARIF (Security → Code scanning)
    strategy:
      fail-fast: false
      matrix:
        # Ajouter « python » avec le premier code applicatif (feature 002).
        language: [actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
