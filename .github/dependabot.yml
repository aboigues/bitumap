# Mises à jour automatiques (spec FR-008 ; principe IX : aucune fusion automatique).
# Écosystèmes à ajouter plus tard :
#   - Python (« uv » ou « pip ») avec le premier code applicatif (feature 002) ;
#   - « opentofu » (répertoire de l'IaC) avec les premiers fichiers .tf (feature 002).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    # Délai avant d'adopter une nouvelle version (versions piégées vite retirées) ;
    # les mises à jour de sécurité ne sont pas retardées.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  # Images des scanners, épinglées par digest dans .github/scanners/*.Dockerfile.
  - package-ecosystem: docker
    directory: /.github/scanners
    schedule:
      interval: monthly
    groups:
      scanners:
        patterns: ["*"]
    # Délai avant d'adopter une nouvelle version (versions piégées vite retirées) ;
    # les mises à jour de sécurité ne sont pas retardées.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, security]
